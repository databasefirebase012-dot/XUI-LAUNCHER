name: XUI Launcher Android CI

concurrency:
  group: xui-android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, xui-redesign]
  workflow_dispatch:

jobs:
  BuildRelease:
    if: github.repository_owner == 'ZalithLauncher' && !startsWith(github.ref, 'refs/pull/') && github.ref_name == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      matrix:
        arch: [ "all", "arm", "arm64", "x86", "x86_64" ]
      fail-fast: false

    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build type
        id: set-env
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          BUILD_TYPE="DEBUG"

          if [[ "$COMMIT_MSG" == *"pre-release"* ]]; then
            BUILD_TYPE="PRE_RELEASE"
          elif [[ "$COMMIT_MSG" == *"release"* ]]; then
            BUILD_TYPE="RELEASE"
          fi

          echo "ZL_BUILD_TYPE=${BUILD_TYPE}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          mkdir -p out
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build Release ${{ matrix.arch }}
        env:
          MOVTERY_KEYSTORE_PASSWORD: ${{ secrets.MOVTERY_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemblerelease -Darch=${{ matrix.arch }} --no-daemon

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="ZalithLauncher/build/outputs/apk/release"
          mapfile -t APK_FILES < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -size +0c)
          if [[ "${#APK_FILES[@]}" -ne 1 ]]; then
            echo "Expected exactly one release APK in $APK_DIR; found ${#APK_FILES[@]}."
            find "$APK_DIR" -maxdepth 1 -type f -print || true
            exit 1
          fi
          unzip -t "${APK_FILES[0]}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root is not set."
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "${APK_FILES[0]}"

      - name: Upload Release ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: XUI-Launcher-Release-${{ github.ref_name }}-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0

  BuildDebug:
    if: startsWith(github.ref, 'refs/pull/') || github.ref_name != 'main' || github.repository_owner != 'ZalithLauncher'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      matrix:
        arch: [ "all", "arm", "arm64", "x86", "x86_64" ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          mkdir -p out
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build Debug ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=${{ matrix.arch }} --no-daemon

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="ZalithLauncher/build/outputs/apk/debug"
          mapfile -t APK_FILES < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -size +0c)
          if [[ "${#APK_FILES[@]}" -ne 1 ]]; then
            echo "Expected exactly one debug APK in $APK_DIR; found ${#APK_FILES[@]}."
            find "$APK_DIR" -maxdepth 1 -type f -print || true
            exit 1
          fi
          unzip -t "${APK_FILES[0]}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK root is not set."
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "${APK_FILES[0]}"

      - name: Upload Debug ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: XUI-Launcher-Debug-${{ github.ref_name }}-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
