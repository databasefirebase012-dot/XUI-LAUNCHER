name: XUI Launcher - Analyze and Build APKs

on:
  push:
    branches: [ xui-redesign ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze XML, IDs, resources and package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: xui-redesign

      - name: Confirm XUI redesign UI source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'xui_tab_indicator_bottom' ZalithLauncher/src/main/res/layout/fragment_settings.xml
          grep -Fq '@drawable/xui_bg_card' ZalithLauncher/src/main/res/layout/fragment_settings.xml
          test -f ZalithLauncher/src/main/res/drawable/xui_tab_indicator_bottom.xml
          echo "PASS: building the XUI redesign UI source from branch xui-redesign."

      - name: Install XML validator
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Run static analysis
        id: analysis
        shell: bash
        run: |
          set -uo pipefail
          REPORT="analysis-report.txt"
          : > "$REPORT"
          FAIL=0

          echo "=== XML syntax validation ===" | tee -a "$REPORT"
          while IFS= read -r -d '' xml; do
            if ! xmllint --noout "$xml" >> "$REPORT" 2>&1; then
              echo "INVALID XML: $xml" | tee -a "$REPORT"
              FAIL=1
            fi
          done < <(find ZalithLauncher/src/main/res -type f -name '*.xml' -print0)
          if [ "$FAIL" -eq 0 ]; then echo "PASS: XML syntax is valid." | tee -a "$REPORT"; fi

          echo "=== Resource and ID reference validation ===" | tee -a "$REPORT"
          if ! python3 - <<'PY' >> "$REPORT" 2>&1
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          res = Path("ZalithLauncher/src/main/res")
          source = Path("ZalithLauncher/src/main")
          xml_files = list(res.rglob("*.xml"))
          defined_ids = set()
          referenced_ids = set()
          available = {"color": set(), "drawable": set(), "string": set()}
          errors = []

          for xml in xml_files:
              try:
                  root = ET.parse(xml).getroot()
              except ET.ParseError:
                  continue
              for node in root.iter():
                  for key, value in node.attrib.items():
                      for name in re.findall(r"@\+id/([A-Za-z0-9_]+)", value):
                          defined_ids.add(name)
                      for name in re.findall(r"(?<!\+)@id/([A-Za-z0-9_]+)", value):
                          referenced_ids.add(name)
                  if root.tag == "resources":
                      name = node.attrib.get("name")
                      if name and node.tag in ("item", "public") and node.attrib.get("type") == "id":
                          defined_ids.add(name)

          for directory in res.iterdir():
              if not directory.is_dir():
                  continue
              kind = directory.name.split("-")[0]
              if kind in ("color", "drawable", "string"):
                  for file in directory.iterdir():
                      if file.is_file() and file.suffix != ".xml":
                          available[kind].add(file.stem)
                      elif file.is_file() and file.suffix == ".xml" and kind != "string":
                          available[kind].add(file.stem)
          for xml in xml_files:
              try:
                  root = ET.parse(xml).getroot()
              except ET.ParseError:
                  continue
              if root.tag == "resources":
                  for node in root:
                      name = node.attrib.get("name")
                      if name and node.tag in ("color", "string", "drawable"):
                          available[node.tag].add(name)
                      if name and node.tag == "item" and node.attrib.get("type") in available:
                          available[node.attrib["type"]].add(name)

          # This value is generated by ZalithLauncher/build.gradle.kts at build time.
          available["string"].add("storageProviderAuthorities")

          for name in sorted(referenced_ids - defined_ids):
              errors.append(f"Unresolved XML @id/{name}")
          for xml in xml_files:
              try:
                  root = ET.parse(xml).getroot()
              except ET.ParseError:
                  continue
              text = " ".join(str(v) for node in root.iter() for v in node.attrib.values())
              for kind, name in re.findall(r"@(color|drawable|string)/([A-Za-z0-9_.]+)", text):
                  if name not in available[kind]:
                      errors.append(f"{xml}: missing @{kind}/{name}")

          java_files = list(source.rglob("*.java")) + list(source.rglob("*.kt"))
          code_ids = set()
          for file in java_files:
              try:
                  content = file.read_text(encoding="utf-8")
              except (OSError, UnicodeError):
                  continue
              code_ids.update(re.findall(r"(?<![\w.])R\.id\.([A-Za-z0-9_]+)", content))
          for name in sorted(code_ids - defined_ids):
              errors.append(f"Unresolved source R.id.{name}")

          if errors:
              print("\n".join("ERROR: " + error for error in errors))
              sys.exit(1)
          print(f"PASS: checked {len(xml_files)} XML files, {len(defined_ids)} defined IDs, and {len(code_ids)} source R.id references.")
          print("PASS: no missing @color, @drawable or @string references found.")
          PY
          then
            FAIL=1
          fi

          echo "=== Package identity validation ===" | tee -a "$REPORT"
          if grep -Fq 'val nameId = "com.movtery.zalithlauncher"' ZalithLauncher/build.gradle.kts              && grep -Fq 'applicationId = nameId' ZalithLauncher/build.gradle.kts              && grep -Fq 'applicationIdSuffix = ".debug"' ZalithLauncher/build.gradle.kts; then
            echo "PASS: namespace/applicationId is com.movtery.zalithlauncher; debug APK package is com.movtery.zalithlauncher.debug." | tee -a "$REPORT"
          else
            echo "ERROR: application package configuration differs from the expected repository identity." | tee -a "$REPORT"
            FAIL=1
          fi

          echo "=== Analysis result ===" | tee -a "$REPORT"
          if [ "$FAIL" -ne 0 ]; then
            echo "FAIL: analysis errors found; build must not run." | tee -a "$REPORT"
            cat "$REPORT"
            exit 1
          fi
          echo "PASS: analysis succeeded; build may proceed." | tee -a "$REPORT"

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report
          path: analysis-report.txt
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build and verify separate ARM APKs
    needs: [ analyze ]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: xui-redesign

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK and install required build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-34" "ndk;25.2.9519653" "build-tools;34.0.0"

      - name: Build JRE components
        run: |
          chmod +x gradlew
          mkdir -p out
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Build 32-bit APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ZalithLauncher/build/outputs/apk/debug
          ./gradlew ZalithLauncher:assembleDebug --no-daemon -Darch=arm
          APK="$(find ZalithLauncher/build/outputs/apk/debug -type f -name '*armeabi-v7a*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/XUI-Launcher-32bit-debug.apk

      - name: Build 64-bit APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ZalithLauncher/build/outputs/apk/debug
          ./gradlew ZalithLauncher:assembleDebug --no-daemon -Darch=arm64
          APK="$(find ZalithLauncher/build/outputs/apk/debug -type f -name '*arm64-v8a*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/XUI-Launcher-64bit-debug.apk

      - name: Verify APK integrity, size, package and ABI
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          for entry in "XUI-Launcher-32bit-debug.apk:armeabi-v7a" "XUI-Launcher-64bit-debug.apk:arm64-v8a"; do
            APK="${entry%%:*}"
            ABI="${entry##*:}"
            FILE="dist/$APK"
            test -s "$FILE"
            SIZE="$(stat -c '%s' "$FILE")"
            if [ "$SIZE" -lt 20971520 ]; then
              echo "ERROR: $FILE is smaller than 20 MB ($SIZE bytes)." >&2
              exit 1
            fi
            unzip -tq "$FILE"
            BADGING="$("$AAPT" dump badging "$FILE")"
            echo "$BADGING"
            echo "$BADGING" | grep -Fq "package: name='com.movtery.zalithlauncher.debug'"
            echo "$BADGING" | grep -Fq "native-code: '$ABI'"
            echo "PASS: $FILE size=$SIZE bytes, package verified, ABI=$ABI, ZIP integrity valid."
          done

      - name: Upload 32-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: XUI-Launcher-32bit
          path: dist/XUI-Launcher-32bit-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload 64-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: XUI-Launcher-64bit
          path: dist/XUI-Launcher-64bit-debug.apk
          if-no-files-found: error
          retention-days: 7
