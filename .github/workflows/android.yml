name: XUI Launcher Android CI

on:
  push:
    branches: [xui-redesign, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build universal debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew jre_lwjgl3glfw:build ZalithLauncher:assembleDebug -Darch=all --no-daemon

      - name: Verify APK archive and signature
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="ZalithLauncher/build/outputs/apk/debug"
          mapfile -t APK_FILES < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -size +0c)
          if [[ "${#APK_FILES[@]}" -ne 1 ]]; then
            echo "Expected exactly one non-empty debug APK in $APK_DIR; found ${#APK_FILES[@]}."
            find "$APK_DIR" -maxdepth 1 -type f -print || true
            exit 1
          fi
          unzip -t "${APK_FILES[0]}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "${APK_FILES[0]}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XUI-Launcher-Debug
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
