name: XUI Launcher Android CI
# One workflow run, one job, two ABI-specific debug APKs.
on:
  push:
    branches: [xui-redesign, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build ARM32 and ARM64 debug APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          mkdir -p dist

          ./gradlew ZalithLauncher:clean ZalithLauncher:assembleDebug -Darch=arm --no-daemon
          mapfile -t ARM32_APKS < <(find ZalithLauncher/build/outputs/apk/debug -maxdepth 1 -type f -name '*armeabi-v7a*.apk' -size +0c)
          if [[ "${#ARM32_APKS[@]}" -ne 1 ]]; then
            echo "Expected one ARM32 debug APK, found ${#ARM32_APKS[@]}."
            find ZalithLauncher/build/outputs/apk/debug -maxdepth 1 -type f -print || true
            exit 1
          fi
          cp "${ARM32_APKS[0]}" dist/XUI-Launcher-Debug-arm32.apk

          ./gradlew ZalithLauncher:clean ZalithLauncher:assembleDebug -Darch=arm64 --no-daemon
          mapfile -t ARM64_APKS < <(find ZalithLauncher/build/outputs/apk/debug -maxdepth 1 -type f -name '*arm64-v8a*.apk' -size +0c)
          if [[ "${#ARM64_APKS[@]}" -ne 1 ]]; then
            echo "Expected one ARM64 debug APK, found ${#ARM64_APKS[@]}."
            find ZalithLauncher/build/outputs/apk/debug -maxdepth 1 -type f -print || true
            exit 1
          fi
          cp "${ARM64_APKS[0]}" dist/XUI-Launcher-Debug-arm64.apk

      - name: Verify both APK archives and signatures
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APK_FILES < <(find dist -maxdepth 1 -type f -name '*.apk' -size +0c | sort)
          if [[ "${#APK_FILES[@]}" -ne 2 ]]; then
            echo "Expected exactly two debug APKs, found ${#APK_FILES[@]}."
            ls -lah dist || true
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for APK in "${APK_FILES[@]}"; do
            unzip -t "$APK"
            "$APKSIGNER" verify --verbose "$APK"
          done

      - name: Upload ARM32 debug APK (separate artifact)
        uses: actions/upload-artifact@v4
        with:
          name: XUI-Launcher-Debug-ARM32
          path: dist/XUI-Launcher-Debug-arm32.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload ARM64 debug APK (separate artifact)
        uses: actions/upload-artifact@v4
        with:
          name: XUI-Launcher-Debug-ARM64
          path: dist/XUI-Launcher-Debug-arm64.apk
          if-no-files-found: error
          compression-level: 0
